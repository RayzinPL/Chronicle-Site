<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle - Configurações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../inicio/style.css">
    <link rel="stylesheet" href="../paginas.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="map-background" aria-hidden="true"></div>
    <div class="content">
        <header class="top-header">

            <div class="logo">
                <img src="../images/Ícone — d20.png" alt="Logo d20">
                <span>Chronicle</span>
            </div>

            <nav class="menu" aria-label="Menu principal">
                <a href="../inicio/index.html" class="menu-item">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9H4zM9 19v-5h6v5" /></svg></span>
                    <span>Início</span>
                </a>
                <a href="../campanhas/index.html" class="menu-item">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 6 6-2 4 2 6-2v14l-6 2-4-2-6 2zM10 4v14M14 6v14" /></svg></span>
                    <span>Campanhas</span>
                    <span class="menu-count">3</span>
                </a>
                <a href="../personagens/index.html" class="menu-item">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3" /><path d="M5 20c.7-3.3 3.1-5 7-5s6.3 1.7 7 5" /></svg></span>
                    <span>Personagens</span>
                </a>
                <a href="../biblioteca/index.html" class="menu-item">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6 0 8 2v13c-2-2-5-3-8-2zM20 5c-3-1-6 0-8 2v13c2-2 5-3 8-2z" /></svg></span>
                    <span>Biblioteca</span>
                </a>
                <a href="../amigos/index.html" class="menu-item">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" /><circle cx="17" cy="9" r="2.5" /><path d="M3 20c.7-3.3 2.7-5 6-5s5.3 1.7 6 5M14 15.5c2.8-.2 5 1.3 5.7 4.5" /></svg></span>
                    <span>Amigos</span>
                </a>
                <a href="../configuracoes/index.html" class="menu-item ativo" aria-current="page">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg></span>
                    <span>Configurações</span>
                </a>
            </nav>

            <div class="header-actions">

                <label class="search">
                    <span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" /><path d="m15 15 5 5" /></svg></span>
                    <input
                        type="search"
                        placeholder="Buscar no Chronicle..."
                        aria-label="Buscar no Chronicle"
                    >
                    <kbd>⌘ K</kbd>
                </label>

                <!-- PERFIL -->
                <div class="perfil">
                    <img
                        class="perfil-logo"
                        src="../images/perfil.jpeg"
                        alt="Foto do usuário"
                    >

                    <div class="perfil-info">
                        <p class="nomeperfil">Daniel</p>
                        <p class="funcao-perfil">Administrador</p>
                    </div>
                </div>

                <!-- NOTIFICAÇÕES (controladas pelo script.js) -->
                <div class="notification-container">

                    <button
                        class="notification"
                        type="button"
                        aria-label="Notificações"
                        aria-expanded="false"
                    >

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
                        </svg>

                        <span class="notification-count" hidden>0</span>

                    </button>

                    <div class="notification-panel" hidden>

                        <div class="notification-header">

                            <div>
                                <h3>Notificações</h3>
                                <span class="notification-subtitle">
                                    Suas últimas atualizações
                                </span>
                            </div>

                            <button class="mark-all-read" type="button">
                                Marcar todas como lidas
                            </button>

                        </div>

                        <div class="notification-list"></div>

                        <div class="notification-footer">
                            Chronicle · Central de notificações
                        </div>

                    </div>

                </div>

            </div>

        </header>
        <main>
<section class="page-head"><div><h1>Configurações</h1><p>Ajuste o Chronicle ao jeito da sua mesa.</p></div></section>
            <form class="settings" id="form-config">
                <section class="panel">
                    <h2>Perfil</h2>
                    <label class="field">Nome<input type="text" name="nome" value="Daniel" autocomplete="name"></label>
                    <label class="field">E-mail<input type="email" name="email" placeholder="voce@email.com" autocomplete="email"></label>
                </section>
                <section class="panel">
                    <h2>Notificações</h2>
                    <label class="setting"><span><strong>Lembrete de sessão</strong><small>Aviso um dia antes de cada sessão.</small></span><span class="switch"><input type="checkbox" name="lembrete" checked><i></i></span></label>
                    <label class="setting"><span><strong>Atividade de amigos</strong><small>Quando alguém entrar numa mesa sua.</small></span><span class="switch"><input type="checkbox" name="amigos" checked><i></i></span></label>
                </section>
                <section class="panel">
                    <h2>Aparência</h2>
                    <label class="setting"><span><strong>Reduzir animações</strong><small>Desativa os movimentos de entrada e de hover.</small></span><span class="switch"><input type="checkbox" name="movimento"><i></i></span></label>
                </section>
                <div class="settings-actions"><button class="btn btn-primary" type="submit">Salvar alterações</button><span class="saved" role="status"></span></div>
            </form>
        </main>
    </div>
    <script src="../inicio/script.js"></script>
    <script src="script.js"></script>
</body>
</html>
